name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also here, not just in ci.yml: this is the path that actually reaches
      # prod, and a partial copy of src/notices/*.json makes TabConfigService
      # throw at boot, so the rolling update would fail its health poll and
      # roll back. `deploy` needs this job, so catching it here saves a
      # deploy-and-rollback cycle. Offline, so a GitHub outage cannot block a
      # release for a reason unrelated to it.
      - name: Fetch contract tooling
        run: git clone --depth 1 https://github.com/spencer0124/skkuverse "$RUNNER_TEMP/sv"
      - name: Contract integrity
        run: python3 "$RUNNER_TEMP/sv/exported/sync_contracts.py" check --repo server --root .
      - run: npm test
        env:
          NAVER_MAP_STYLE_ID: ${{ secrets.NAVER_MAP_STYLE_ID }}
      - run: npm run lint

  # One job per origin host, in order: each needs the one before, so a host
  # is deployed only after the previous one finished healthy, and a failed
  # host stops the rollout there. The steps live in deploy-host.yml.
  #
  # Two jobs rather than a matrix with max-parallel: 1 — GitHub documents the
  # order a matrix's jobs are *created* in, not the order they *run* in, and
  # "oracle first" is the part that matters: it is the host that runs the
  # poller, and the one a bad release should stop on.
  #
  # Adding a host: a job here that needs the previous one, its secrets, and a
  # /etc/skkuverse/host.env on it (docs/how-to/lock-origin-to-cloudflare.md,
  # "Onboard another origin host"). deploy-workflow.test.ts pins the chain.
  deploy-oracle:
    needs: test
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: oracle
    secrets:
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  # Switchable: runs only when the repo variable MNEMOSYNE_ENABLED is `true`
  # (Settings → Secrets and variables → Actions → Variables). Unset or `false`
  # pauses deploys to this host without a code change; the job then shows as
  # skipped and the run stays green. A job-level `if` can read `vars` but not
  # `secrets`, hence a variable. The implicit success() still applies, so a
  # failed deploy-oracle stops the rollout here as before.
  deploy-mnemosyne:
    needs: [test, deploy-oracle]
    if: ${{ vars.MNEMOSYNE_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: mnemosyne
    secrets:
      VM_HOST: ${{ secrets.MNEMOSYNE_VM_HOST }}
      VM_USER: ${{ secrets.MNEMOSYNE_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.MNEMOSYNE_SSH_PRIVATE_KEY }}
