name: Cloudflare IP drift

# Compares infra/cloudflare/ips-v{4,6}.txt with the ranges Cloudflare
# publishes. Those lists feed the nginx real-IP snippet and the host firewall,
# so a range Cloudflare adds and we lack is an edge the firewall rejects.
# A red run is the alert: GitHub emails whoever last changed this schedule.
# What to do then: docs/how-to/lock-origin-to-cloudflare.md.
#
# Scheduled runs only fire on the default branch, and GitHub pauses them after
# 60 days without repository activity.

on:
  schedule:
    - cron: "17 0 * * 1" # Mondays 09:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: the script uses only Node built-ins.
      - run: npm run cloudflare-ips -- --live
