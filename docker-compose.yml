# Every api replica is the same container on its own loopback port; only the
# port differs, so they share one definition. Adding a replica means a service
# here, a line in infra/nginx/api.skkuverse.com's upstream, an entry in the
# deploy workflow's REPLICAS, and an override in docker-compose.local-verify.yml
# — __tests__/nest/infra/replica-topology.test.ts fails until all four agree.
#
# Sizing: a Node process runs its JavaScript on one thread, so a replica gains
# nothing from more than one core; capacity comes from the number of replicas.
# The VM has 4 cores; three 1-core replicas leave about one core for the
# poller, crawler, AI service, OTA server and nginx. cpu_shares only matters
# under contention, where it lets the replicas win over those neighbours.
x-api: &api
  build: .
  env_file:
    - .env
  environment:
    - NODE_ENV=production
    - ROLE=api
    - TZ=Asia/Seoul
  depends_on:
    - poller
  restart: unless-stopped
  mem_limit: 384m
  cpus: 1.0
  cpu_shares: 2048
  networks:
    - skkuverse
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

services:
  poller:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ROLE=poller
      - TZ=Asia/Seoul
      # Safety-net cron for FCM dispatch — only the poller container runs it.
      # Primary trigger is the crawler's cycle-end ping to /internal/notices/dispatch-pending.
      - DISPATCH_SWEEP_ENABLED=true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks:
      - skkuverse
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-1:
    <<: *api
    ports:
      - "127.0.0.1:3001:3000"

  api-2:
    <<: *api
    ports:
      - "127.0.0.1:3002:3000"

  api-3:
    <<: *api
    ports:
      - "127.0.0.1:3003:3000"

networks:
  skkuverse:
    external: true
